[project]
name = "schema-drift"
version = "0.1.0"
description = "Compare ORM models against a live database and generate verified additive-only migrations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["database", "migrations", "schema", "orm", "drift", "ddl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = []

# Database drivers are imported lazily inside each connector's _connect(), so you
# only need the one matching the database you actually point it at.
[project.optional-dependencies]
postgresql = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1.0"]
sqlserver = ["pymssql>=2.2.0"]
all = ["psycopg2-binary>=2.9", "pymysql>=1.1.0", "pymssql>=2.2.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_drift"]
